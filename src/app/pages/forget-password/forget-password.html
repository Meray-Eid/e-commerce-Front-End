<div class="icon-header">
  <i class="pi pi-bolt"></i>
</div>

<h2 class="title">Forgot Password?</h2>
<p class="subtitle">Fill in your details to reset password</p>

<form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <div class="input-wrapper">
      <i class="pi pi-envelope input-icon"></i>
      <input
        type="email"
        id="email"
        formControlName="email"
        placeholder="Email"
        class="form-input"
        [class.input-error]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
      />
    </div>

    <small
      class="error-msg"
      *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
      Please enter a valid email address.
    </small>
  </div>

<button
  type="submit"
  class="submit-btn"
  [disabled]="forgotPasswordForm.invalid || isLoading">

  <span *ngIf="!isLoading">Reset Password</span>

  <span *ngIf="isLoading">
    <i class="pi pi-spin pi-spinner mr-2"></i> Sending...
  </span>

</button>
</form>

<div class="back-link-container">
  Remember your password? <a routerLink="/login" class="back-link">Login here</a>
</div>
